<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5b3926">
    <title>Enchantment Guide</title>
    <style>
        :root {
            --cream: #fffaf0;
            --cream-deep: #f7e8b6;
            --butter: #f4cf65;
            --butter-soft: #fff1b8;
            --coffee: #5b3926;
            --coffee-dark: #382216;
            --coffee-light: #8b654b;
            --line: #e8d5ac;
            --paper: rgba(255, 253, 246, .94);
            --shadow: 0 16px 40px rgba(79, 49, 28, .12);
        }

        * {
            box-sizing: border-box;
        }

        html {
            background: var(--cream);
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--coffee-dark);
            font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
            font-size: 15px;
            line-height: 1.65;
            background:
                radial-gradient(circle at 12% 8%, rgba(244, 207, 101, .32), transparent 25rem),
                radial-gradient(circle at 90% 28%, rgba(139, 101, 75, .10), transparent 30rem),
                linear-gradient(145deg, #fffdf7 0%, #fff7df 52%, #f8ebc9 100%);
            background-attachment: fixed;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: .32;
            background-image: radial-gradient(rgba(91, 57, 38, .18) .7px, transparent .7px);
            background-size: 18px 18px;
            pointer-events: none;
        }

        .tabs {
            position: sticky;
            top: 0;
            z-index: 1000;
            display: grid;
            grid-template-columns: repeat(4, minmax(90px, 1fr));
            gap: 8px;
            width: min(920px, calc(100% - 32px));
            margin: 18px auto 0;
            padding: 8px;
            border: 1px solid rgba(255, 241, 184, .2);
            border-radius: 18px;
            background: rgba(70, 42, 27, .94);
            box-shadow: 0 10px 30px rgba(56, 34, 22, .22);
            backdrop-filter: blur(12px);
        }

        .tab {
            position: relative;
            min-width: 0;
            padding: 11px 12px;
            overflow: hidden;
            border: 1px solid transparent;
            border-radius: 12px;
            color: #fff7df;
            font-weight: 700;
            letter-spacing: .04em;
            text-align: center;
            cursor: pointer;
            transition: transform .2s ease, color .2s ease, background .2s ease, box-shadow .2s ease;
            user-select: none;
        }

        .tab:hover {
            color: #fff;
            background: rgba(255, 241, 184, .12);
            transform: translateY(-1px);
        }

        .tab.active {
            color: var(--coffee-dark);
            border-color: rgba(255, 255, 255, .5);
            background: linear-gradient(135deg, #fff4bd, var(--butter));
            box-shadow: 0 5px 14px rgba(31, 18, 10, .22);
        }

        .content {
            display: none;
            width: min(920px, calc(100% - 32px));
            margin: 24px auto 56px;
            padding: clamp(20px, 4vw, 38px);
            border: 1px solid rgba(139, 101, 75, .18);
            border-radius: 26px;
            background: var(--paper);
            box-shadow: var(--shadow);
            animation: reveal .35s ease both;
        }

        .content.active {
            display: block;
        }

        h2 {
            position: relative;
            margin: 0 0 18px;
            padding: 0 0 11px 18px;
            color: var(--coffee);
            font-family: Georgia, "Noto Serif TC", serif;
            font-size: clamp(1.2rem, 3vw, 1.55rem);
            line-height: 1.35;
            letter-spacing: .02em;
        }

        h2:not(:first-child) {
            margin-top: 36px;
        }

        h2::before {
            content: "";
            position: absolute;
            top: .12em;
            bottom: .45em;
            left: 0;
            width: 6px;
            border-radius: 10px;
            background: linear-gradient(var(--butter), #dcae3c);
            box-shadow: 0 0 0 4px rgba(244, 207, 101, .18);
        }

        h2::after {
            content: "";
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            height: 1px;
            background: linear-gradient(90deg, var(--line), transparent);
        }

        table {
            width: 100%;
            margin: 0;
            overflow: hidden;
            border: 1px solid var(--line);
            border-spacing: 0;
            border-collapse: separate;
            border-radius: 16px;
            background: #fffdf8;
            box-shadow: 0 7px 18px rgba(91, 57, 38, .06);
        }

        th,
        td {
            padding: 12px 16px;
            border: 0;
            border-bottom: 1px solid #efe2c5;
            text-align: center;
            vertical-align: middle;
        }

        th {
            color: #fffaf0;
            font-size: .86rem;
            font-weight: 700;
            letter-spacing: .08em;
            background: linear-gradient(135deg, var(--coffee), #765139);
        }

        th:first-child,
        td:first-child {
            width: 112px;
            font-weight: 800;
        }

        td:first-child {
            color: var(--coffee);
            background: rgba(255, 241, 184, .38);
        }

        /* Grade backgrounds are provided by enchantmentGradeColors in scripts.js. */
        td[data-grade] {
            color: #000000;
        }

        tbody tr:last-child td {
            border-bottom: 0;
        }

        tbody tr {
            transition: background-color .18s ease;
        }

        tbody tr:nth-child(even) {
            background: rgba(255, 248, 226, .55);
        }

        tbody tr:hover {
            background: var(--butter-soft);
        }

        .enchantment-grades {
            display: grid;
            grid-template-columns: repeat(3, max-content);
            justify-content: center;
            gap: 4px 8px;
            margin-top: 7px;
            color: var(--coffee);
            font-size: .78rem;
            font-variant-numeric: tabular-nums;
        }

        .enchantment-grades span {
            padding: 2px 7px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--cream);
            white-space: nowrap;
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 620px) {
            body {
                font-size: 14px;
            }

            .tabs {
                top: 8px;
                width: calc(100% - 20px);
                margin-top: 10px;
                gap: 4px;
                padding: 6px;
                border-radius: 15px;
            }

            .tab {
                padding: 9px 5px;
                font-size: .82rem;
                letter-spacing: 0;
            }

            .content {
                width: calc(100% - 20px);
                margin-top: 14px;
                padding: 20px 14px 26px;
                border-radius: 20px;
            }

            h2:not(:first-child) {
                margin-top: 30px;
            }

            th,
            td {
                padding: 10px 9px;
            }

            th:first-child,
            td:first-child {
                width: 68px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
